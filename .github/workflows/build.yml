name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q Spendly.zip
      - name: Build
        working-directory: Spendly
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Spendly-apk
          path: Spendly/app/build/outputs/apk/debug/app-debug.apk
